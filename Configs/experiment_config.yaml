# =============================================================================
# Experiment Configuration - 消融实验配置
# Version: v1.0
# =============================================================================

# 实验基本信息
experiment:
  name: "multi_modal_ablation"
  description: "多模态LOB-Trade融合模型消融实验"
  version: "v2.0"

# =============================================================================
# 数据配置 (所有实验统一)
# =============================================================================
data:
  history_T: 6000         # 历史窗口 (100ms * 3000 = 5min)
  sample_stride: 100        # 采样步长 (减少样本重叠)
  split_ratio: 0.8         # 训练/验证划分比例
  num_levels: 10           # LOB档位数

# =============================================================================
# DataLoader配置
# =============================================================================
dataloader:
  batch_size: 128
  num_workers: 4
  prefetch_factor: 4
  pin_memory: True
  drop_last: true
  device: "cuda"


