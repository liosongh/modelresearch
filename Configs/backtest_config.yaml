model_checkpoint: "checkpoints/multi_modal_model_3/seed_42/best_model.pt"
model_config: "Configs/model_config.yaml"

data:
  lob_path: "/root/autodl-tmp/test_data/lob_data.npy"
  trade_path: "/root/autodl-tmp/test_data/trade_data.npy"
  label_path: "/root/autodl-tmp/test_data/trade_labels_ret.npy"
  time_bucket_path: "/root/autodl-tmp/test_data/time_bucket.npy"

signal_config:
  history_T: 1200
  signal_stride: 100
  batch_size: 512
  num_workers: 4
  pin_memory: true
  alpha: 0.001
  use_amp: true

backtest:
  strategy: "discrete"
  fee_rate: 0.0001
  slippage: 0.0001
  initial_capital: 1000000
  execution_delay: 1
  risk_free_rate: 0.0

output:
  result_dir: "Backtest/result"
  log_dir: "Backtest/log"
