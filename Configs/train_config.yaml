# =============================================================================
# Training Configuration - Multi-Modal LOB & Trade Model
# Version: v2.0
# =============================================================================

# # -----------------------------------------------------------------------------
# # Data Configuration
# # -----------------------------------------------------------------------------
data:
  history_T: 3000          # 历史窗口长度 (100ms * 3000 = 5min)
  sample_stride: 100        # 训练时的采样步长
  split_ratio: 0.8       # 训练/验证划分比例
  
  # 数据路径配置
  lob_path: '/root/autodl-tmp/train_data/lob_data.npy'           # LOB数据路径 (运行时指定)
  trade_path: '/root/autodl-tmp/train_data/trade_data.npy'         # Trade数据路径 (运行时指定)
  label_path: '/root/autodl-tmp/train_data/trade_labels_ret.npy'         # 标签路径 (运行时指定)
  
#   # 标签配置
#   label_horizon: 3000        # 预测horizon (k步后的收益)
#   label_smoothing: 0.0     # 标签平滑系数

# # -----------------------------------------------------------------------------
# # DataLoader Configuration
# # -----------------------------------------------------------------------------
# dataloader:
#   batch_size: 512
#   num_workers: 4
#   pin_memory: true
#   prefetch_factor: 2
#   persistent_workers: true

# -----------------------------------------------------------------------------
# Optimizer Configuration
# -----------------------------------------------------------------------------
optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8

# -----------------------------------------------------------------------------
# Learning Rate Scheduler Configuration
# -----------------------------------------------------------------------------
scheduler:
  type: "CosineAnnealingWarmRestarts"
  T_0: 1                 # 第一次重启的epoch数
  T_mult: 1                # 重启周期倍增因子
  eta_min: 1.0e-6          # 最小学习率

# -----------------------------------------------------------------------------
# Loss Configuration
# -----------------------------------------------------------------------------
loss:
  classification:
    type: "FocalLoss"
    alpha: 1.0
    gamma: 2.0
    class_weights: null    # 可选: [1.0, 0.5, 1.0] 针对不平衡
  regression:
    type: "HuberLoss"
    delta: 1.0
  loss_weight: 1.0      # 分类损失权重 (回归权重 = 1 - loss_weight)

# -----------------------------------------------------------------------------
# Training Loop Configuration
# -----------------------------------------------------------------------------
training:
  epochs: 3
  use_amp: true            # 混合精度训练
  grad_accumulation_steps: 1
  max_grad_norm: 1.0       # 梯度裁剪
  
  # Early Stopping
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.001
    monitor: "loss"  # 监控指标 "val_f1_updown"
    mode: "min"

  perf_cfg:
    enable_step_profile: true
    profile_sync_cuda: true
    profile_warmup_steps: 20
    profile_max_steps: 500
    tag: "default"
    # compare_to_tag: null
  
  # # Checkpointing
  # checkpoint:
  #   save_dir: "./checkpoints/multi_modal_model_7"
  #   save_top_k: 3
  #   save_last: true

output:
  checkpoint_dir: "./checkpoints/"
  log_dir: "/root/tf-logs/"
  log_interval: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: "LOB_MultiModal"

